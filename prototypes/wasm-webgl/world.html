<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мир оживших рисунков</title>
  </head>
  <body data-role="owner">
    <main class="live-main">
      <h1>Подводный мир</h1>
      <form id="access-form" class="live-access">
        <label>Логин владельца <input name="login" autocomplete="username" required></label>
        <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
        <label>ID сессии (оставьте пустым для новой) <input name="sessionId" autocomplete="off"></label>
        <button type="submit">Открыть мир</button>
      </form>
      <p id="access-status" role="status" aria-live="polite"></p>
      <section id="world-shell" hidden>
        <p>Сессия: <code id="session-id"></code> <button type="button" id="invite">Подключить телефон</button></p>
        <p id="invitation" role="status"></p>
        <form id="approve-viewer-form" class="live-approve">
          <label>Код с экрана TV <input name="code" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" required></label>
          <label><input name="interact" type="checkbox"> Разрешить действия на экране</label>
          <button type="submit">Подключить экран</button>
        </form>
        <p id="viewer-approval-status" role="status"></p>
        <div id="action-panel" class="interaction-controls">
          <button type="button" id="action-feed">Корм</button>
          <button type="button" id="action-boat">Подводная лодка</button>
          <button type="button" id="action-cancel">Отмена</button>
        </div>
        <p id="interaction-status" role="status" aria-live="polite"></p>
        <div id="world-stage" class="live-stage">
          <canvas id="world-canvas" aria-label="Подводный мир; выбор точки действия"></canvas>
          <span id="world-crosshair" class="live-crosshair" aria-hidden="true" hidden>+</span>
        </div>
      </section>
    </main>
    <script type="module" src="/src/live-app.ts"></script>
  </body>
</html>
