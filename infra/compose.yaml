name: ldw
services:
  db:
    image: ${POSTGRES_IMAGE:?Set a verified postgres 18 image digest in runtime.env}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums
    secrets:
      - postgres_password
      - app_db_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/10-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks: [database]
    shm_size: 128mb
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
networks:
  database:
    internal: true
volumes:
  postgres_data:
secrets:
  postgres_password:
    file: /etc/ldw/secrets/postgres_password
  app_db_password:
    file: /etc/ldw/secrets/app_db_password
