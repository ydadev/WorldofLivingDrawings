name: Browser risk probes
on:
  push:
    paths:
      - '.github/workflows/risk-01.yml'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'prototypes/wasm-core/**'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - 'schemas/**'
      - 'content/**'
      - 'prototypes/**'
      - 'tools/build-content.mjs'
      - 'tools/test-contracts.mjs'
      - 'tools/test-transport.mjs'
      - 'tools/test-core-renderer-browser.mjs'
      - 'tools/build-wasm.mjs'
      - 'tools/test-risk-browser.mjs'
      - 'tools/test-fish-browser.mjs'
      - 'tools/test-paint-browser.mjs'
      - 'tools/test-capture-browser.mjs'
      - 'tools/test-interaction-browser.mjs'
      - 'tools/test-live-ui-browser.mjs'
  pull_request:
    paths:
      - '.github/workflows/risk-01.yml'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'prototypes/wasm-core/**'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - 'schemas/**'
      - 'content/**'
      - 'prototypes/**'
      - 'tools/build-content.mjs'
      - 'tools/test-contracts.mjs'
      - 'tools/test-transport.mjs'
      - 'tools/test-core-renderer-browser.mjs'
      - 'tools/build-wasm.mjs'
      - 'tools/test-risk-browser.mjs'
      - 'tools/test-fish-browser.mjs'
      - 'tools/test-paint-browser.mjs'
      - 'tools/test-capture-browser.mjs'
      - 'tools/test-interaction-browser.mjs'
      - 'tools/test-live-ui-browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm-webgl-csp:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install minimal WebAssembly target
        run: rustup target add wasm32v1-none --toolchain 1.98.1
      - name: Install root workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check contracts and renderer types
        run: npm run test:contracts && npm run typecheck && npm run test:transport
      - name: Install locked dependencies
        working-directory: prototypes/wasm-webgl
        run: npm ci --no-audit --no-fund
      - name: Build Rust and TypeScript
        working-directory: prototypes/wasm-webgl
        run: npm run build
      - name: Check generated fish files are current
        run: git diff --exit-code -- prototypes/fish-assets/generated
      - name: Check bundled underwater assets are current
        run: npm run build:content && git diff --exit-code -- content/underwater
      - name: Run Chrome browser probe
        working-directory: prototypes/wasm-webgl
        run: npm run test:browser
      - name: Run Chrome fish UV and model probe
        working-directory: prototypes/wasm-webgl
        run: npm run test:fish
      - name: Run Chrome browser painting probe
        working-directory: prototypes/wasm-webgl
        run: npm run test:paint
      - name: Run Chrome paper capture synthetic probe
        working-directory: prototypes/wasm-webgl
        run: npm run test:capture
      - name: Run Chrome two-screen interaction probe
        working-directory: prototypes/wasm-webgl
        run: npm run test:interaction
      - name: Run Chrome renderer adapter probe
        working-directory: prototypes/wasm-webgl
        run: npm run test:core-renderer
      - name: Run Chrome live world UI probe
        working-directory: prototypes/wasm-webgl
        run: npm run test:live-ui
