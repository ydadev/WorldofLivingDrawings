name: Repository policy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate repository and commit metadata
        run: node tools/check-repository.mjs --history
      - name: Check shell syntax
        run: |
          bash -n infra/bootstrap-ubuntu.sh infra/backup-local.sh infra/backup-consistent.sh infra/backup-manifest.sh tools/test-backup-consistency.sh
          sh -n infra/postgres/10-app.sh .githooks/pre-commit .githooks/commit-msg .githooks/pre-push
