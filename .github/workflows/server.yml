name: Server migrations
on:
  push:
    paths:
      - '.github/workflows/server.yml'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - 'content/**'
      - 'prototypes/wasm-webgl/**'
      - 'tools/test-real-ui-browser.mjs'
      - 'tools/test-backup-consistency.sh'
      - 'tools/test-live-scene-restore.sh'
      - 'tools/test-backup-retention.py'
      - 'infra/backup-*.sh'
  pull_request:
    paths:
      - '.github/workflows/server.yml'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - 'content/**'
      - 'prototypes/wasm-webgl/**'
      - 'tools/test-real-ui-browser.mjs'
      - 'tools/test-backup-consistency.sh'
      - 'tools/test-live-scene-restore.sh'
      - 'tools/test-backup-retention.py'
      - 'infra/backup-*.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install rustfmt
        run: rustup component add rustfmt --toolchain 1.98.1
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check server crate and migration constraints
        # These integration tests share one PostgreSQL database; one test
        # deliberately bumps every active scene epoch to emulate restart.
        run: cargo test -p ldw-server --locked -- --test-threads=1
      - name: Check concurrent simulation admission in a fresh database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ldw_capacity'
          DATABASE_URL=postgres://postgres@127.0.0.1:5432/ldw_capacity \
          LDW_TEST_SIMULATED_SESSION_LIMIT=3 \
          cargo test -p ldw-server --locked simulated_session_limit_rejects_fourth_concurrent_start -- --ignored
      - name: Check three real-time scenes, 100 fish, Controllers, Viewers and uploads
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ldw_three_scenes'
          DATABASE_URL=postgres://postgres@127.0.0.1:5432/ldw_three_scenes \
          LDW_TEST_SIMULATED_SESSION_LIMIT=3 \
          cargo test -p ldw-server --locked three_hundred_fish_progress_across_three_real_time_scenes -- --ignored --nocapture
      - name: Build restored-scene verification probe
        run: cargo build -p ldw-server --example restore_probe --locked
      - name: Check blob GC maintenance command
        run: |
          install -d -m 0700 "$RUNNER_TEMP/ldw-gc-blobs"
          printf '%s\n' "$DATABASE_URL" > "$RUNNER_TEMP/ldw-ci-db-url"
          chmod 0600 "$RUNNER_TEMP/ldw-ci-db-url"
          LDW_DATABASE_URL_FILE="$RUNNER_TEMP/ldw-ci-db-url" \
          LDW_BLOB_DIR="$RUNNER_TEMP/ldw-gc-blobs" \
          cargo run -p ldw-server --locked -- gc-blobs
      - name: Check deterministic simulation core
        run: cargo test -p ldw-sim --locked
      - name: Probe three scenes and ten logical minutes
        run: cargo run --release -p ldw-sim --example three_scene_probe --locked
      - name: Check consistent DB and blob backup
        run: bash tools/test-backup-consistency.sh
      - name: Check backup retention boundaries
        run: python3 tools/test-backup-retention.py
      - name: Check browser WebAssembly target for simulation core
        run: rustup target add wasm32-unknown-unknown --toolchain 1.98.1 && cargo build -p ldw-sim --target wasm32-unknown-unknown --locked
      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install minimal browser WebAssembly target
        run: rustup target add wasm32v1-none --toolchain 1.98.1
      - name: Install root workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser dependencies
        working-directory: prototypes/wasm-webgl
        run: npm ci --no-audit --no-fund
      - name: Build browser pages
        working-directory: prototypes/wasm-webgl
        run: npm run build
      - name: Test browser painting and local drafts
        working-directory: prototypes/wasm-webgl
        run: npm run test:paint
      - name: Test browser pages with real server and PostgreSQL
        working-directory: prototypes/wasm-webgl
        run: npm run test:real-ui
